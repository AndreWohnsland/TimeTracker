[project]
name = "time-tracker"
version = "1.5.1"
description = "Track your time with Python and Qt"
authors = [{ name = "Andre Wohnsland", email = "50302161+AndreWohnsland@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.19.1",
    "gitpython>=3.1.59",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "xlsxwriter>=3.2.9",
    "qtawesome>=1.4.2",
    "holidays>=0.103",
    "pyqt6>=6.11.0",
    "numpy>=2.5.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "pyqtdarktheme-fork>=2.3.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "jupyterlab>=4.6.3",
    "ty==0.0.74",
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# ui/ holds pyuic6-generated code
exclude = ["ui", "*.ipynb"]

[tool.ruff.lint]
extend-safe-fixes = [
  "UP", # pyupgrade
  "D107", # Missing docstring in __init__
  "D205", # 1 blank line required between summary line and description
  "W291", # Trailing whitespace
]
per-file-ignores = { "runme.py" = ["E402"], "tests/*" = ["PLR2004"] }
select = [
  "A", # flake8-builtins
  "ANN", # Type annotations
  "C", # Convention
  "C4", # flake-comprehensions
  "D", # pydocstyle 
  "E", # pycodestyle
  "F", # Pyflakes
  "I", # isort
  "ICN001", # {name} should be imported as {asname},
  "PIE", # flake8-pie
  "PL", # pylint
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "Q", # flake8-quotes
  "R", # Refactor
  "RET", # flake8-return
  "RUF", # Ruff
  "SIM", # flake8-simplify
  "UP", # pyupgrade
  "W", # Pylint (Warning)
]
ignore = [
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
]
